<mat-toolbar class="topbar">
  <a class="brand" routerLink="/overview" aria-label="NutriFlow — на главную">
    <span class="brand-mark"><mat-icon>eco</mat-icon></span
    ><span>Nutri<span>Flow</span></span>
  </a>
  <nav class="desktop-nav" aria-label="Основная навигация">
    @for (item of navigation; track item.path) {
      <a mat-button [routerLink]="item.path" routerLinkActive="active"
        ><mat-icon>{{ item.icon }}</mat-icon
        >{{ item.label }}</a
      >
    }
  </nav>
  <span class="spacer"></span>
  <button mat-icon-button aria-label="Уведомления" class="notification">
    <mat-icon>notifications_none</mat-icon><span class="notification-dot"></span>
  </button>
  <a mat-button class="family-action" routerLink="/family" routerLinkActive="active">
    <mat-icon>family_restroom</mat-icon><span>Управление семьёй</span>
  </a>
  @if (session.authenticated()) {
    <button mat-stroked-button class="auth-action" (click)="session.logout()">
      <mat-icon>logout</mat-icon><span>Выйти</span>
    </button>
  } @else {
    <button mat-flat-button class="auth-action login" (click)="session.login()">
      <mat-icon>login</mat-icon><span>Войти</span>
    </button>
  }
  <button
    mat-icon-button
    class="mobile-menu"
    [matMenuTriggerFor]="navMenu"
    aria-label="Открыть меню"
  >
    <mat-icon>menu</mat-icon>
  </button>
</mat-toolbar>
<mat-menu #navMenu="matMenu">
  @for (item of navigation; track item.path) {
    <a mat-menu-item [routerLink]="item.path"
      ><mat-icon>{{ item.icon }}</mat-icon
      >{{ item.label }}</a
    >
  }
</mat-menu>
<main><router-outlet /></main>
