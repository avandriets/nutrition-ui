<mat-sidenav-container class="app-shell">
  <mat-sidenav #drawer mode="over" position="start">
    <div class="px-4 pt-4 pb-2 text-sm font-medium text-muted tracking-wide">Sections</div>
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeDrawer()"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/meals" routerLinkActive="active" (click)="closeDrawer()">
        <mat-icon matListItemIcon>restaurant</mat-icon>
        <span matListItemTitle>Meals</span>
      </a>
      <a mat-list-item routerLink="/profile" routerLinkActive="active" (click)="closeDrawer()">
        <mat-icon matListItemIcon>person</mat-icon>
        <span matListItemTitle>Profile</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button type="button" aria-label="Open menu" (click)="toggleDrawer()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="ml-2 font-medium">Nutrition</span>
      <span class="flex-auto"></span>
      <a mat-button routerLink="/auth/login">Log In</a>
      <a mat-flat-button color="accent" routerLink="/auth/signup">Sign Up</a>
    </mat-toolbar>

    <main class="p-6 max-w-content mx-auto">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
