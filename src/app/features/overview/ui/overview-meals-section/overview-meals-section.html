<div class="section-title">
  <div>
    <h2>Today’s meals</h2>
    <p>{{ userName() }} · added: {{ summaries().length }}</p>
  </div>
  <a mat-button
     routerLink="/meals">
    All meals
    <mat-icon>arrow_forward</mat-icon>
  </a>
</div>

<app-ui-state-container height="150px"
                        [state]="state()"
                        [resolved]="resolved"
                        [empty]="empty">
  <ng-template #resolved>
    <app-overview-meals-table [summaries]="summaries()" />
  </ng-template>
</app-ui-state-container>

<ng-template #empty>
  <mat-card class="empty-meals">
    <mat-icon>restaurant</mat-icon>
    <div>
      <h3>No meals today</h3>
      <p>Create your first meal and enter a portion.</p>
    </div>
    <a mat-stroked-button
       routerLink="/meals"
       [queryParams]="{ create: true }">Add</a>
  </mat-card>
</ng-template>
