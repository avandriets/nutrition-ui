<app-ui-page size="wide"
             spacing="compact"
             headerMargin="30px"
             headerStack="tablet"
             [header]="pageState().resolved">
  <app-overview-heading title
                        [today]="today"
                        [user]="selectedUser()" />

  @if (pageState().resolved && users().length) {
    <app-overview-actions action
                          [users]="users()"
                          [selectedUserId]="selectedUserId()" />
  }

  <ng-container body>
    <app-ui-state-container height="380px"
                            [state]="pageState()"
                            [resolved]="resolved"
                            [empty]="empty">
      <ng-template #resolved>
        <app-overview-nutrition-section [state]="goalState()"
                                        [userName]="selectedUser()!.name"
                                        [totals]="dayTotals()"
                                        [calorieTarget]="calorieTarget()"
                                        [caloriePercent]="caloriePercent()"
                                        [calorieRemaining]="calorieRemaining()"
                                        [nutrients]="nutrients()" />

        <app-overview-meals-section [state]="mealsState()"
                                    [userName]="selectedUser()!.name"
                                    [summaries]="mealSummaries()" />
      </ng-template>
    </app-ui-state-container>
  </ng-container>
</app-ui-page>

<ng-template #empty>
  <mat-card class="empty-family">
    <mat-icon>group_add</mat-icon>
    <div>
      <h2>Add family members</h2>
      <p>A personal nutrition summary will appear here once you add family members.</p>
    </div>
    <a mat-stroked-button
       routerLink="/family">Manage family</a>
  </mat-card>
</ng-template>
