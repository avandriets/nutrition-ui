<label>
  <span>From</span>
  <input #fromInput
         type="date"
         aria-label="Statistics start date"
         [value]="dateFrom()"
         (change)="updateDateFrom(fromInput.value)" />
</label>
<label>
  <span>To</span>
  <input #toInput
         type="date"
         aria-label="Statistics end date"
         [max]="today()"
         [value]="dateTo()"
         (change)="updateDateTo(toInput.value)" />
</label>
<div class="granularity-filter">
  <span>Group by</span>
  <mat-select aria-label="Statistics grouping"
              [value]="granularity()"
              (selectionChange)="updateGranularity($event.value)">
    <mat-option value="day">Day</mat-option>
    <mat-option value="week">Week</mat-option>
    <mat-option value="month">Month</mat-option>
  </mat-select>
</div>
<mat-slide-toggle [checked]="includeEmptyDays()"
                  (change)="updateIncludeEmptyDays($event.checked)">Include days without entries</mat-slide-toggle>
