<label>
  <span>С</span>
  <input #fromInput
         type="date"
         aria-label="Начало периода статистики"
         [value]="dateFrom()"
         (change)="updateDateFrom(fromInput.value)" />
</label>
<label>
  <span>По</span>
  <input #toInput
         type="date"
         aria-label="Конец периода статистики"
         [max]="today()"
         [value]="dateTo()"
         (change)="updateDateTo(toInput.value)" />
</label>
<div class="granularity-filter">
  <span>Группировка</span>
  <mat-select aria-label="Группировка статистики"
              [value]="granularity()"
              (selectionChange)="updateGranularity($event.value)">
    <mat-option value="day">По дням</mat-option>
    <mat-option value="week">По неделям</mat-option>
    <mat-option value="month">По месяцам</mat-option>
  </mat-select>
</div>
<mat-slide-toggle [checked]="includeEmptyDays()"
                  (change)="updateIncludeEmptyDays($event.checked)">Учитывать дни без записей</mat-slide-toggle>
