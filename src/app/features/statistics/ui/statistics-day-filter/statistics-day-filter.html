<button mat-icon-button
        aria-label="Previous day"
        (click)="shiftDay(-1)">
  <mat-icon>chevron_left</mat-icon>
</button>
<label>
  <span>Report date</span>
  <input #dayInput
         type="date"
         aria-label="Goal progress report date"
         [max]="today()"
         [value]="day()"
         (change)="setDay(dayInput.value)" />
</label>
<button mat-icon-button
        aria-label="Next day"
        [disabled]="day() >= today()"
        (click)="shiftDay(1)">
  <mat-icon>chevron_right</mat-icon>
</button>
