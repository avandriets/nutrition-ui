<app-ui-page size="wide"
             spacing="compact"
             headerMargin="32px">
  <ng-container title>
    <span class="eyebrow">АНАЛИТИКА ПИТАНИЯ</span>
    <h1>Статистика</h1>
    <p class="page-description">Достижение целей за день, средние значения и динамика рациона.</p>
  </ng-container>

  @if (initialState().resolved && users().length) {
    <app-statistics-user-filter action
                                [users]="users()"
                                [selectedUserId]="selectedUserId()" />
  }

  <ng-container body>
    <app-ui-state-container height="450px"
                            [state]="initialState()"
                            [resolved]="resolved"
                            [empty]="empty">
      <ng-template #resolved>
        <app-daily-statistics-section [state]="dailyState()"
                                      [actionError]="dailyError()"
                                      [reports]="dailyReports()"
                                      [selectedDay]="selectedDay()"
                                      [today]="today"
                                      [selectedUserName]="selectedUserName()"
                                      (actionErrorDismissed)="dismissDailyError()" />

        <app-period-statistics-section [state]="periodState()"
                                       [actionError]="periodError()"
                                       [averageReports]="averageReports()"
                                       [timelineReports]="timelineReports()"
                                       [dateFrom]="dateFrom()"
                                       [dateTo]="dateTo()"
                                       [today]="today"
                                       [granularity]="granularity()"
                                       [includeEmptyDays]="includeEmptyDays()"
                                       [metric]="selectedMetric()"
                                       (actionErrorDismissed)="dismissPeriodError()" />
      </ng-template>
    </app-ui-state-container>
  </ng-container>
</app-ui-page>

<ng-template #empty>
  <mat-card class="empty-family">
    <div class="empty-icon"><mat-icon>group_add</mat-icon></div>
    <div>
      <h2>Сначала добавьте членов семьи</h2>
      <p>После этого здесь появятся персональные отчёты.</p>
    </div>
    <a mat-stroked-button
       routerLink="/family">Управление семьёй</a>
  </mat-card>
</ng-template>
