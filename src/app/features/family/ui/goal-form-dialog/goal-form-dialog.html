<div class="dialog-heading">
  <div class="dialog-icon">
    <mat-icon>flag</mat-icon>
  </div>
  <div>
    <h2 mat-dialog-title>{{ goal ? 'Edit goal' : 'New goal' }}</h2>
    <p>
      {{ goal ? 'Update the values for the selected period.' : 'A new entry keeps previous targets in the history.' }}
    </p>
  </div>
</div>
<mat-dialog-content>
  <form id="goal-form"
        [formGroup]="form"
        (ngSubmit)="submit()">
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Calories</mat-label>
        <input matInput
               type="number"
               formControlName="daily_calories_kcal" />
        <span matTextSuffix>kcal</span>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Protein</mat-label>
        <input matInput
               type="number"
               formControlName="daily_protein_g" />
        <span matTextSuffix>g</span>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Fiber</mat-label>
        <input matInput
               type="number"
               formControlName="daily_fiber_g" />
        <span matTextSuffix>g</span>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Effective from</mat-label>
        <input matInput
               type="date"
               formControlName="effective_from" />
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button
          mat-dialog-close>Cancel</button>
  <button mat-flat-button
          class="primary"
          form="goal-form"
          type="submit"
          [disabled]="form.invalid">
    {{ goal ? 'Save changes' : 'Add goal' }}
  </button>
</mat-dialog-actions>
