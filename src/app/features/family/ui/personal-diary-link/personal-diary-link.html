<a class="diary-link"
   [routerLink]="['/family/users', user().id, 'diary']">
  <mat-card class="diary-preview">
    <div class="diary-icon"><mat-icon>menu_book</mat-icon></div>
    <div>
      <span>PERSONAL DIARY</span>
      <h3>Personal food diary {{ user().name }}</h3>
      <p>Individual portions, daily totals, and goal progress for the selected day.</p>
    </div>
    <span class="open-link">
      Open
      <mat-icon>arrow_forward</mat-icon>
    </span>
  </mat-card>
</a>
