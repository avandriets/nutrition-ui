<div class="section-heading">
  <div>
    <h2>Daily goal</h2>
    <p>Targets change by date; previous values are retained</p>
  </div>
  <button mat-button
          [disabled]="createPending()"
          (click)="addRequested.emit()">
    <mat-icon>add</mat-icon>
    {{ goals().length ? 'New goal' : 'Set up' }}
  </button>
</div>

<app-ui-state-container height="140px"
                        [state]="state()"
                        [resolved]="resolved"
                        [empty]="empty">

  <ng-template #resolved>
    <app-ui-state-container height="100px"
                            [state]="activeGoalState()"
                            [resolved]="activeGoalResolved"
                            [empty]="activeGoalEmpty">

      <ng-template #activeGoalResolved>
        <app-goal-summary [goal]="currentGoal()!" />
      </ng-template>
    </app-ui-state-container>

    <app-goal-history [goals]="goals()"
                      [currentGoalId]="currentGoal()?.id ?? null"
                      [pendingIds]="pendingIds()"
                      (editRequested)="editRequested.emit($event)" />
  </ng-template>
</app-ui-state-container>

<ng-template #empty>
  <mat-card class="empty-goal">
    <div class="empty-goal-icon">
      <mat-icon>flag</mat-icon>
    </div>
    <div>
      <h3>No goal set yet</h3>
      <p>Set calorie, protein, and fiber targets for the personal diary.</p>
    </div>
    <button mat-stroked-button
            [disabled]="createPending()"
            (click)="addRequested.emit()">Set up
    </button>
  </mat-card>
</ng-template>

<ng-template #activeGoalEmpty>
  <mat-card class="empty-goal">
    <div class="empty-goal-icon">
      <mat-icon>schedule</mat-icon>
    </div>
    <div>
      <h3>No current goal</h3>
      <p>Scheduled goals take effect on their start date.</p>
    </div>
  </mat-card>
</ng-template>
