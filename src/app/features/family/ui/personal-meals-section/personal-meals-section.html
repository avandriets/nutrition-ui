<div class="section-heading">
  <div>
    <h2>Meals</h2>
    <p>Individual portions only {{ userName() }}</p>
  </div>
</div>

<app-ui-state-container height="300px"
                        [state]="state()"
                        [resolved]="resolved"
                        [empty]="empty">
  <ng-template #resolved>
    @for (view of mealViews(); track view.meal.id) {
      <app-personal-meal-card [view]="view" />
    }
  </ng-template>
</app-ui-state-container>

<ng-template #empty>
  <mat-card class="empty-meals">
    <div class="empty-icon"><mat-icon>restaurant_menu</mat-icon></div>
    <h3>No portions on this date</h3>
    <p>Add a portion for this member to a shared family meal.</p>
    <a mat-stroked-button
       routerLink="/meals">Go to meals</a>
  </mat-card>
</ng-template>
