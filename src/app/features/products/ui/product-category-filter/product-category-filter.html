<mat-select class="category-select"
            aria-label="Category"
            [value]="category()"
            (selectionChange)="categoryChange.emit($event.value)">
  <mat-option value="all">All categories</mat-option>
  @for (item of categories(); track item) {
    <mat-option [value]="item">{{ item }}</mat-option>
  }
</mat-select>
