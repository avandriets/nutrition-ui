<div class="ui-confirm-dialog__icon"
     [class.ui-confirm-dialog__icon--danger]="tone === 'danger'">
  <mat-icon>{{ icon }}</mat-icon>
</div>

<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  @for (part of data.message; track $index) {
    @if (part.emphasis) {
      <strong>{{ part.text }}</strong>
    } @else {
      <span>{{ part.text }}</span>
    }
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button
          [mat-dialog-close]="false">{{ cancelText }}</button>
  <button mat-flat-button
          [class.danger]="tone === 'danger'"
          [mat-dialog-close]="true">{{ confirmText }}</button>
</mat-dialog-actions>
